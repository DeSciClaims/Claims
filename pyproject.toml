[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "claims-subnet-rfc"
version = "0.1.0"
description = "Public Claims subnet repo with self-contained miner, ontology enrichment, and validator packages."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "bittensor",
    "dspy==3.1.2",
    "langchain",
    "langchain-openai",
    "lxml",
    "numpy",
    "openpyxl",
    "pdf-inspector",
    "psutil",
    "pydantic>=2",
    "pypdf",
    "python-dotenv",
    "requests",
]

[project.optional-dependencies]
dev = [
    "pre-commit>=4,<5",
    "pytest",
    "ruff==0.16.8",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["F821"]

[tool.ruff.lint.per-file-ignores]
"miner/section_context_v1/config.py" = ["F821"]
"miner/v0/config.py" = ["F821"]
"validator/judge_v1/config.py" = ["F821"]

[tool.setuptools.packages.find]
include = ["miner*", "validator*", "neurons*"]
