name: Container images

on:
  pull_request:
    paths:
      - ".github/workflows/container-images.yml"
      - ".dockerignore"
      - "docker/**"
      - "examples/**"
      - "miner/**"
      - "neurons/**"
      - "validator/**"
      - "schemas/**"
      - "pyproject.toml"
      - "requirements.txt"
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - ".github/workflows/container-images.yml"
      - ".dockerignore"
      - "docker/**"
      - "examples/**"
      - "miner/**"
      - "neurons/**"
      - "validator/**"
      - "schemas/**"
      - "pyproject.toml"
      - "requirements.txt"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: claims-images-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  miner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: image
        name: Resolve image name
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-miner" >> "$GITHUB_OUTPUT"

      - id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=sha,prefix=
            type=ref,event=tag
            type=raw,value=edge,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: miner
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            CLAIMS_REVISION=${{ github.sha }}
            HERMES_COMMIT=${{ vars.HERMES_COMMIT }}
          cache-from: type=gha,scope=miner
          cache-to: type=gha,mode=max,scope=miner

  validator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: Claims

      - name: Require pinned dependencies
        env:
          HERMES_COMMIT: ${{ vars.HERMES_COMMIT }}
          REFERENCE_REF: ${{ vars.CLAIMS_REFERENCE_MINER_REF }}
        run: |
          test -n "${HERMES_COMMIT}" || { echo "HERMES_COMMIT repository variable is required" >&2; exit 1; }
          test -n "${REFERENCE_REF}" || { echo "CLAIMS_REFERENCE_MINER_REF repository variable is required" >&2; exit 1; }

      - uses: actions/checkout@v4
        with:
          repository: DeSciClaims/claims-reference-miner
          ref: ${{ vars.CLAIMS_REFERENCE_MINER_REF }}
          path: claims-reference-miner
          persist-credentials: false

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: image
        name: Resolve image name
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/claims-validator" >> "$GITHUB_OUTPUT"

      - id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=sha,prefix=
            type=ref,event=tag
            type=raw,value=edge,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: Claims
          file: Claims/docker/Dockerfile
          target: validator
          platforms: linux/amd64
          build-contexts: |
            claims_reference_miner=claims-reference-miner
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            CLAIMS_REVISION=${{ github.sha }}
            HERMES_COMMIT=${{ vars.HERMES_COMMIT }}
          cache-from: type=gha,scope=validator
          cache-to: type=gha,mode=max,scope=validator
